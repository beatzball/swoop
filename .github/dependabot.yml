version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area: ci"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "area: ci"]
  # The macOS frame's Swift package: libghostty-spm cuts a release from
  # Ghostty's main almost daily, so a bump is a small pull request with CI
  # and the bench behind it.
  - package-ecosystem: swift
    directory: /shell/mac
    schedule:
      interval: weekly
    labels: ["dependencies", "area: frame"]
