name: ci

on:
  push:
    branches: [main]
  pull_request:
  # By hand, to show a flake in the launcher test is gone: the test step
  # runs that many times in a row on each runner, and stops at the first
  # failure.
  #   gh workflow run ci.yml --ref <branch> -f launcher_runs=20
  workflow_dispatch:
    inputs:
      launcher_runs:
        description: How many times in a row to run the launcher test
        default: "1"

# Actions are pinned to a commit, with the tag in a comment, because a tag can
# be moved and a commit cannot. Dependabot bumps both together. The token gets
# read access only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on every OS, including Windows, so the same commands run everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: go version
        run: go version
      # The same four checks as `make test` and `make build`, spelled out so
      # the Windows runner does not need make.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o bin/ ./cmd/...
      # The launcher script and the bundled extensions are bash. shellcheck
      # ships on the Ubuntu runner; once is enough, they are the same on
      # every OS.
      - name: shellcheck
        if: runner.os == 'Linux'
        # Every shell file: the launcher, the extensions, and the scripts
        # that say they are bash. scripts/launcher-test is Python.
        run: shellcheck bin/swoop $(grep -Il -e '^#!/usr/bin/env bash' -e '^# shellcheck shell=bash' extensions/*/* scripts/*)
      - name: release-gate tests
        if: runner.os == 'Linux'
        run: scripts/release-gate-test
      # The installer's launchd steps against a fake launchctl: pure bash,
      # so every OS runs it.
      - name: launchd test
        run: scripts/launchd-test
      # The launcher end to end, through a pseudo-terminal. Needs a recent
      # fzf: the distro's is too old for transform and become, so Linux
      # takes fzf's own release, the one scripts/get would install.
      - name: fzf for the launcher test
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/junegunn/fzf/releases/download/v0.74.4/fzf-0.74.4-linux_amd64.tar.gz | tar -xz -C "$HOME/.local/bin" fzf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: fzf for the launcher test
        if: runner.os == 'macOS'
        run: brew install fzf
      # Once, or as many times in a row as a dispatch by hand asks for.
      # The number comes in through the environment, never pasted into the
      # script, and anything that is not a number is refused.
      - name: launcher test
        if: runner.os != 'Windows'
        env:
          LAUNCHER_RUNS: ${{ inputs.launcher_runs || '1' }}
        run: |
          case "$LAUNCHER_RUNS" in
            ''|*[!0-9]*) echo "launcher_runs must be a number: $LAUNCHER_RUNS"; exit 1 ;;
          esac
          for i in $(seq 1 "$LAUNCHER_RUNS"); do
            echo "launcher test, run $i of $LAUNCHER_RUNS"
            scripts/launcher-test
          done
      # The frame's build directory, libghostty and all, so a run with the
      # same dependencies does an incremental build (about 20 s) instead
      # of a full one (about 70 s). Keyed on the resolved dependencies and
      # the sources; a source change still restores the dependencies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: runner.os == 'macOS'
        with:
          path: shell/mac/.build
          key: swift-${{ runner.os }}-${{ hashFiles('shell/mac/Package.resolved') }}-${{ hashFiles('shell/mac/Sources/**') }}
          restore-keys: |
            swift-${{ runner.os }}-${{ hashFiles('shell/mac/Package.resolved') }}-
            swift-${{ runner.os }}-
      # The macOS frame is a Swift package; only the macOS runner can build
      # it. Release mode, because that is what ships.
      - name: build the macOS frame
        if: runner.os == 'macOS'
        run: swift build -c release --package-path shell/mac

  # A pull request that bumps VERSION must add the matching CHANGELOG section.
  # One that leaves VERSION alone is not this job's business.
  version-changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: A VERSION bump needs a matching CHANGELOG section
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if git show "$base:VERSION" > /tmp/base-version 2>/dev/null && cmp -s /tmp/base-version VERSION; then
            echo "VERSION unchanged, nothing to check."
            exit 0
          fi
          scripts/release-gate check

  # A push to main whose VERSION has no tag yet gets one; every other push
  # finds the tag already there and stops. It does not wait for the tests
  # above: the pull request ran the same tests on the same tree, and the
  # ruleset on main requires them green before a merge, so a cut reaches
  # the release a few minutes sooner. The tests still run here, as a
  # report. The step starts release.yml on the new tag itself; that needs
  # actions: write.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag v$VERSION if it does not exist
        run: |
          scripts/release-gate check
          v="v$(scripts/release-gate version)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v"
          git push origin "refs/tags/$v"
          echo "tagged $v"
          gh workflow run release.yml --ref "$v"
          echo "started the release of $v"
        env:
          GH_TOKEN: ${{ github.token }}
