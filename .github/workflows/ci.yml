name: ci

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to a commit, with the tag in a comment, because a tag can
# be moved and a commit cannot. Dependabot bumps both together. The token gets
# read access only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash on every OS, including Windows, so the same commands run everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: go version
        run: go version
      # The same four checks as `make test` and `make build`, spelled out so
      # the Windows runner does not need make.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go build
        run: go build -o bin/ ./cmd/...
      # The launcher script and the bundled extensions are bash. shellcheck
      # ships on the Ubuntu runner; once is enough, they are the same on
      # every OS.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck bin/swoop extensions/*/* scripts/*
      - name: release-gate tests
        if: runner.os == 'Linux'
        run: scripts/release-gate-test
      # The macOS frame is a Swift package; only the macOS runner can build
      # it. Release mode, because that is what ships.
      - name: build the macOS frame
        if: runner.os == 'macOS'
        run: swift build -c release --package-path shell/mac

  # A pull request that bumps VERSION must add the matching CHANGELOG section.
  # One that leaves VERSION alone is not this job's business.
  version-changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: A VERSION bump needs a matching CHANGELOG section
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if git show "$base:VERSION" > /tmp/base-version 2>/dev/null && cmp -s /tmp/base-version VERSION; then
            echo "VERSION unchanged, nothing to check."
            exit 0
          fi
          scripts/release-gate check

  # Cut the tag once a VERSION lands on main with no tag behind it. Runs on
  # every push to main and is idempotent: a merge that did not bump VERSION
  # finds the tag already there and stops. It needs the tests green first,
  # because a tag is the one thing here that is awkward to take back.
  tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag v$VERSION if it does not exist
        run: |
          scripts/release-gate check
          v="v$(scripts/release-gate version)"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "$v already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v"
          git push origin "refs/tags/$v"
          echo "tagged $v"
